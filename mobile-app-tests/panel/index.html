<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Emulator</title>
<style>
  :root { --you: #4c8dff; --claude: #e07a4f; --muted: #8b93a1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--muted); }
  [hidden] { display: none !important; }
  body { display: flex; align-items: center; justify-content: center; }

  #device { position: relative; width: 270px; height: 600px; border-radius: 18px; overflow: hidden; background: #000; }
  #screen { width: 100%; height: 100%; display: block; cursor: pointer; touch-action: none; outline: none; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .tap { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
    border: 3px solid var(--c); background: color-mix(in srgb, var(--c) 25%, transparent); animation: ripple .9s ease-out forwards; }
  svg.swipe { position: absolute; inset: 0; width: 100%; height: 100%; animation: fade 1.2s forwards; overflow: visible; }
  #cover { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center;
    justify-content: center; text-align: center; padding: 24px; background: #000; }
  .spinner { width: 28px; height: 28px; border: 3px solid #262a31; border-top-color: #e0b04f; border-radius: 50%;
    animation: spin .9s linear infinite; }
  button { background: var(--you); color: #fff; border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; cursor: pointer; }

  @keyframes ripple { from { transform: scale(.4); opacity: 1 } to { transform: scale(1.5); opacity: 0 } }
  @keyframes fade { 0%, 60% { opacity: 1 } to { opacity: 0 } }
  @keyframes spin { to { transform: rotate(360deg) } }
</style>
</head>
<body>
  <div id="device">
    <canvas id="screen" tabindex="0" aria-label="Android screen"></canvas>
    <div id="overlay"></div>
    <div id="cover">
      <div id="spinner" class="spinner"></div>
      <div id="cover-text">Connecting…</div>
      <button id="start" hidden>Start emulator</button>
    </div>
  </div>

<script>
// Phone-only view. Input: click = tap, drag = swipe, wheel = scroll, type = text,
// Esc / right-click = Back, middle-click = Home. Everything else goes through panel/emu.js.
const $ = s => document.querySelector(s);
const canvas = $('#screen'), ctx = canvas.getContext('2d'), overlay = $('#overlay'), box = $('#device');
let status = { phase: 'starting' }, mode = '';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp01 = v => Math.min(Math.max(v, 0), 1);

// ── status + actions ─────────────────────────────────────────────────────────
const events = new EventSource('/events');
events.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.type === 'status') setStatus(m);
  if (m.type === 'action' && !m.replay) { mark(m); scheduleSettle(1200); }
};

function setStatus(s) {
  status = s;
  $('#cover').hidden = s.phase === 'ready';
  $('#spinner').hidden = !['booting', 'starting'].includes(s.phase);
  $('#start').hidden = s.phase !== 'no-device';
  $('#cover-text').textContent = {
    booting: 'Booting Android…',
    'no-device': 'No emulator running',
    'no-adb': 'adb not found — check ANDROID_HOME',
  }[s.phase] || 'Connecting…';
  layout();
}

function layout() {
  const d = status.display && status.display.w > 0 ? status.display : { w: 1080, h: 2400 };
  const s = Math.min((innerWidth - 8) / d.w, (innerHeight - 8) / d.h);
  box.style.width = `${Math.floor(d.w * s)}px`;
  box.style.height = `${Math.floor(d.h * s)}px`;
}
addEventListener('resize', layout);
layout();

function mark(m) {
  if (m.rx == null) return;
  const color = m.source === 'claude' ? 'var(--claude)' : 'var(--you)';
  const els = [];
  if (m.kind === 'swipe') {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'swipe');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.innerHTML = `<line x1="${m.rx * 100}" y1="${m.ry * 100}" x2="${m.rx2 * 100}" y2="${m.ry2 * 100}"
      style="stroke:${color}" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".8"/>`;
    els.push(svg);
  }
  const dot = document.createElement('div');
  dot.className = 'tap';
  dot.style.cssText = `--c:${color};left:${(m.rx2 ?? m.rx) * 100}%;top:${(m.ry2 ?? m.ry) * 100}%`;
  els.push(dot);
  overlay.append(...els);
  setTimeout(() => els.forEach(el => el.remove()), 1300);
}

// ── screen ───────────────────────────────────────────────────────────────────
let gotFrame = false, fellBack = false, readySince = 0, streamAbort = null;

function draw(src, w, h, exact = false) {
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.drawImage(src, 0, 0, w, h);
  gotFrame = true;
  if (!exact && mode === 'H.264') scheduleSettle(500);
}

// The encoder only sends changes, so an imperfect last frame of an animation would stay on screen.
// Once the video goes quiet (and after every action), repaint with an exact screenshot.
let settleTimer = null, settleSeq = 0;
function scheduleSettle(ms) {
  clearTimeout(settleTimer);
  const seq = ++settleSeq;
  settleTimer = setTimeout(async () => {
    if (status.phase !== 'ready' || mode !== 'H.264') return;
    try {
      const r = await fetch('/api/screenshot', { cache: 'no-store' });
      if (!r.ok || seq !== settleSeq) return;                    // newer video arrived meanwhile
      const bmp = await createImageBitmap(await r.blob());
      if (seq === settleSeq) draw(bmp, canvas.width || bmp.width, canvas.height || bmp.height, true);
      bmp.close();
    } catch { /* next settle will retry */ }
  }, ms);
}

function findSps(au) {
  for (let i = 0; i + 4 < au.length; i++) {
    if (au[i] === 0 && au[i + 1] === 0 && au[i + 2] === 1 && (au[i + 3] & 0x1f) === 7) {
      const n = au.subarray(i + 3, i + 3 + 24);
      const hex = b => b.toString(16).padStart(2, '0');
      return { codec: `avc1.${hex(n[1])}${hex(n[2])}${hex(n[3])}`, id: Array.from(n).join(',') };
    }
  }
  return null;
}

async function streamOnce() {
  streamAbort = new AbortController();
  const res = await fetch('/stream', { cache: 'no-store', signal: streamAbort.signal });
  if (!res.ok || !res.body) throw new Error(`stream ${res.status}`);
  const reader = res.body.getReader();
  let buf = new Uint8Array(0), decoder = null, spsId = '', ts = 0, needKey = true;
  const reset = () => {
    try { decoder?.close(); } catch {}
    decoder = null; needKey = true;
    fetch('/api/stream/restart', { method: 'POST' });        // new encoder session → fresh keyframe
  };
  for (;;) {
    const { value, done } = await reader.read();
    if (done) { try { decoder?.close(); } catch {} return; }
    const merged = new Uint8Array(buf.length + value.length);
    merged.set(buf); merged.set(value, buf.length);
    buf = merged;
    let off = 0;
    while (buf.length - off >= 5) {
      const len = ((buf[off] << 24) | (buf[off + 1] << 16) | (buf[off + 2] << 8) | buf[off + 3]) >>> 0;
      if (buf.length - off - 5 < len) break;
      const key = buf[off + 4] & 1;
      const au = buf.slice(off + 5, off + 5 + len);
      off += 5 + len;
      if (key) {
        const sps = findSps(au);
        if (sps && (!decoder || sps.id !== spsId)) {
          try { decoder?.close(); } catch {}
          const config = { codec: sps.codec, optimizeForLatency: true };
          if (!(await VideoDecoder.isConfigSupported(config)).supported) {
            throw Object.assign(new Error(`H.264 ${sps.codec} not supported`), { fatal: true });
          }
          decoder = new VideoDecoder({
            output: f => { draw(f, f.displayWidth, f.displayHeight); f.close(); },
            error: err => { console.warn('decoder', err); reset(); },
          });
          decoder.configure(config);
          spsId = sps.id;
          mode = 'H.264';
        }
        needKey = false;
      }
      if (!decoder || needKey || decoder.state !== 'configured') continue;
      decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp: (ts += 16_667), data: au }));
    }
    buf = buf.slice(off);
  }
}

async function runPng(reason) {
  console.info('Screen: PNG snapshots —', reason);
  mode = 'PNG';
  for (;;) {
    if (status.phase !== 'ready' || document.hidden) { await sleep(500); continue; }
    try {
      const r = await fetch('/api/screenshot', { cache: 'no-store' });
      if (r.ok) { const bmp = await createImageBitmap(await r.blob()); draw(bmp, bmp.width, bmp.height); bmp.close(); }
      else await sleep(500);
    } catch { await sleep(1000); }
  }
}

function fallBack(reason) {
  if (fellBack) return;
  fellBack = true;
  streamAbort?.abort();
  runPng(reason);
}

// If the video stream never produces a frame (e.g. the device encoder won't start), use snapshots.
setInterval(() => {
  readySince = status.phase === 'ready' ? (readySince || Date.now()) : 0;
  if (!gotFrame && readySince && Date.now() - readySince > 12_000) fallBack('no video frames within 12 s');
}, 2000);

async function runScreen() {
  if (!('VideoDecoder' in window)) return fallBack('WebCodecs unavailable');
  while (!fellBack) {
    try { await streamOnce(); }
    catch (e) {
      if (fellBack) return;
      console.warn('stream', e);
      if (e.fatal) return fallBack(e.message);
    }
    if (!fellBack) await sleep(1000);                         // reconnect
  }
}
runScreen();

// ── input ────────────────────────────────────────────────────────────────────
function send(body, route = '/api/input') {
  return fetch(route, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: 'you', ...body }) })
    .then(async r => { if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText); return r.json(); })
    .catch(err => console.warn('input', err.message));
}
function rel(e) {
  const r = canvas.getBoundingClientRect();
  return { rx: clamp01((e.clientX - r.left) / r.width), ry: clamp01((e.clientY - r.top) / r.height) };
}

let down = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.focus();
  if (e.button === 2) { send({ action: 'key', key: 'BACK' }); return; }     // right-click = Back
  if (e.button === 1) { e.preventDefault(); send({ action: 'key', key: 'HOME' }); return; }   // middle-click = Home
  canvas.setPointerCapture(e.pointerId);
  down = { ...rel(e), t: performance.now(), x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const up = rel(e);
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const held = performance.now() - down.t;
  if (moved < 10) send(held > 550 ? { action: 'longpress', rx: down.rx, ry: down.ry, ms: Math.round(held) } : { action: 'tap', rx: down.rx, ry: down.ry });
  else send({ action: 'swipe', rx1: down.rx, ry1: down.ry, rx2: up.rx, ry2: up.ry, ms: Math.round(Math.min(Math.max(held, 80), 1500)) });
  down = null;
});

let wheel = 0, wheelTimer;
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  wheel += e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    const d = Math.max(-0.35, Math.min(0.35, wheel / 1200));
    wheel = 0;
    send({ action: 'swipe', rx1: 0.5, ry1: 0.5 + d / 2, rx2: 0.5, ry2: 0.5 - d / 2, ms: 250 });
  }, 120);
}, { passive: false });

const KEYMAP = { Enter: 'ENTER', Backspace: 'DEL', Delete: 'FORWARD_DEL', Escape: 'BACK', Tab: 'TAB',
  ArrowUp: 'DPAD_UP', ArrowDown: 'DPAD_DOWN', ArrowLeft: 'DPAD_LEFT', ArrowRight: 'DPAD_RIGHT' };
let typed = '', typeTimer;
function flushTyped() { clearTimeout(typeTimer); if (typed) { send({ action: 'text', text: typed }); typed = ''; } }
canvas.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (KEYMAP[e.key]) { e.preventDefault(); flushTyped(); send({ action: 'key', key: KEYMAP[e.key] }); }
  else if (e.key.length === 1) { e.preventDefault(); typed += e.key; clearTimeout(typeTimer); typeTimer = setTimeout(flushTyped, 250); }
});
canvas.addEventListener('paste', e => { const t = e.clipboardData.getData('text'); if (t) send({ action: 'text', text: t }); });
$('#start').addEventListener('click', () => send({}, '/api/emulator/start'));
</script>
</body>
</html>
